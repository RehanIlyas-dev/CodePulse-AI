[project]
name = "codepulse-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.68.0",
    "sqlalchemy>=2.0.52",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.14.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
